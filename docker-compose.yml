services:
  cedeva-db:
    image: postgres:17-alpine
    container_name: cedeva-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrongPassword123
      - POSTGRES_DB=Cedeva
    ports:
      - "5432:5432"
    volumes:
      - cedeva-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d Cedeva
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  cedeva-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cedeva-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=cedeva-db;Port=5432;Database=Cedeva;Username=postgres;Password=YourStrongPassword123
    ports:
      - "5000:8080"
    volumes:
      - cedeva-dpkeys:/keys
    depends_on:
      cedeva-db:
        condition: service_healthy

volumes:
  cedeva-pgdata:
  cedeva-dpkeys:
