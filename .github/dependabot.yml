version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # At 5, unmerged PRs blocked every new NuGet update for two months (Aug–Oct 2026).
    open-pull-requests-limit: 10
    groups:
      # Dependabot puts a package in the FIRST matching group: "testing" must stay before
      # "microsoft", or Microsoft.Playwright / Microsoft.NET.Test.Sdk would land there.
      # Microsoft.AspNetCore.Mvc.Testing stays with "microsoft" (it follows the ASP.NET version).
      testing:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "NSubstitute"
          - "Microsoft.Playwright"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Testcontainers*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
    ignore:
      # FluentAssertions 8+ requires a paid commercial license (Xceed); v7 stays fully
      # open-source. Cedeva is commercial, so block the jump past the last free major.
      - dependency-name: "FluentAssertions"
        versions: [">=8"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
