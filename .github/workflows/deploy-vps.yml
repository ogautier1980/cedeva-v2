name: Build and deploy to OVH VPS - Cedeva

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Run tests (with coverage gate)
        # Total line coverage must stay >= 85% (regression floor / ratchet — raise over time;
        # actual ~89%). Migrations and generated Razor views are excluded from the measure.
        run: >
          dotnet test tests/Cedeva.Tests -c Release
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          "-p:ExcludeByFile=**/Migrations/*.cs"
          "-p:Exclude=[*]AspNetCoreGeneratedDocument.*"
          -p:Threshold=85
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cedeva-v2:latest
            ghcr.io/${{ github.repository_owner }}/cedeva-v2:${{ github.sha }}

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/cedeva
            docker compose -f docker-compose.prod.yml pull cedeva-web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verify deployment (health endpoint)
        run: |
          echo "Probing /health endpoint..."
          HEALTH_URL="https://new.cedeva.be/health"
          for i in {1..18}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ App is healthy (HTTP 200 on /health)"
              exit 0
            fi
            echo "Attempt $i/18: /health returned $CODE, waiting 10s..."
            sleep 10
          done
          echo "✗ App failed to become healthy within timeout"
          exit 1
